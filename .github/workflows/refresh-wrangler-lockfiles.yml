name: Refresh pinned Wrangler lockfiles

on:
  push:
    branches:
      - chore/platform-freshness-2026-11-09

permissions:
  contents: write

concurrency:
  group: refresh-wrangler-lockfiles
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Regenerate root lockfile for Wrangler 4.159.0
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Regenerate Auth lockfile for Wrangler 4.159.0
        working-directory: auth-worker
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Regenerate Next lockfile for Wrangler 4.159.0
        working-directory: ai-worker
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json auth-worker/package-lock.json ai-worker/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already match their package manifests."
            exit 0
          fi
          git commit -m "chore: regenerate lockfiles for Wrangler 4.159.0"
          git push origin HEAD:chore/platform-freshness-2026-11-09
