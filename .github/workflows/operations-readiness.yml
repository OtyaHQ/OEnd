name: Otya Operations Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/operations-readiness.yml'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: otya-operations-readiness
  cancel-in-progress: true

jobs:
  readiness:
    name: Check production recovery and schema readiness
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Install locked Core tooling
        run: npm ci --ignore-scripts

      - name: Validate repository migration discipline
        id: migration_layout
        continue-on-error: true
        run: npm run verify:migrations

      - name: Verify Core D1 has no unapplied migrations
        id: core_migrations
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 migrations list DB --remote | tee /tmp/core-migrations.txt
          if grep -Eq '[0-9]{4}_[A-Za-z0-9_-]+\.sql' /tmp/core-migrations.txt; then
            echo 'ERROR: Core D1 has unapplied repository migrations.'
            exit 1
          fi

      - name: Verify Auth D1 migration visibility
        id: auth_migrations
        continue-on-error: true
        working-directory: auth-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx wrangler d1 migrations list AUTH_DB --remote | tee /tmp/auth-migrations.txt
          # Auth still has a preserved-schema repair path. Report drift here but
          # do not auto-apply until that legacy repair path is fully retired.
          if grep -Eq '[0-9]{8}_[A-Za-z0-9_-]+\.sql' /tmp/auth-migrations.txt; then
            echo 'WARNING: Auth D1 has migration-ledger drift; inspect before changing the repair path.'
          fi

      - name: Verify canonical OEnd OID and O D1 Time Travel recovery points
        id: time_travel
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info otya-end-db --config wrangler.toml --json > /tmp/oend-time-travel.json
          npx wrangler d1 time-travel info otya-id-db --config auth-worker/wrangler.toml --json > /tmp/oid-time-travel.json
          npx wrangler d1 time-travel info o-prod-db --config ai-worker/wrangler.toml --json > /tmp/o-time-travel.json
          for file in /tmp/oend-time-travel.json /tmp/oid-time-travel.json /tmp/o-time-travel.json; do
            test -s "$file"
          done
          echo 'Canonical OEnd, OID and O D1 recovery points are available.'

      - name: Verify Opoint and Omy Play product D1 Time Travel recovery points
        id: product_time_travel
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/OtyaHQ/OPoint.git "$RUNNER_TEMP/OPoint"
          git clone --depth 1 --branch main https://github.com/OtyaHQ/Omy_Play.git "$RUNNER_TEMP/Omy_Play"
          npx --yes wrangler@4.159.0 d1 time-travel info opoint-prod-db --config "$RUNNER_TEMP/OPoint/wrangler.toml" --json > /tmp/opoint-time-travel.json
          npx --yes wrangler@4.159.0 d1 time-travel info omy-play-prod-db --config "$RUNNER_TEMP/Omy_Play/wrangler.omy-play-production.toml" --json > /tmp/omy-play-time-travel.json
          test -s /tmp/opoint-time-travel.json
          test -s /tmp/omy-play-time-travel.json
          echo 'Opoint and Omy Play production D1 recovery points are available.'

      - name: Write readiness summary
        if: always()
        env:
          MIGRATION_LAYOUT: ${{ steps.migration_layout.outcome }}
          CORE_MIGRATIONS: ${{ steps.core_migrations.outcome }}
          AUTH_MIGRATIONS: ${{ steps.auth_migrations.outcome }}
          TIME_TRAVEL: ${{ steps.time_travel.outcome }}
          PRODUCT_TIME_TRAVEL: ${{ steps.product_time_travel.outcome }}
        run: |
          {
            echo '## Otya production operations readiness'
            echo
            echo "- Repository migration layout: ${MIGRATION_LAYOUT}."
            echo "- Core production migration drift check: ${CORE_MIGRATIONS}."
            echo "- Auth migration visibility check: ${AUTH_MIGRATIONS}."
            echo "- Canonical OEnd/OID/O D1 Time Travel availability: ${TIME_TRAVEL}."
            echo "- Opoint/Omy Play D1 Time Travel availability: ${PRODUCT_TIME_TRAVEL}."
            echo '- This workflow is diagnostic only: it never applies migrations or restores a database.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce readiness gate
        if: always()
        env:
          MIGRATION_LAYOUT: ${{ steps.migration_layout.outcome }}
          CORE_MIGRATIONS: ${{ steps.core_migrations.outcome }}
          AUTH_MIGRATIONS: ${{ steps.auth_migrations.outcome }}
          TIME_TRAVEL: ${{ steps.time_travel.outcome }}
          PRODUCT_TIME_TRAVEL: ${{ steps.product_time_travel.outcome }}
        run: |
          set -euo pipefail
          for result in "$MIGRATION_LAYOUT" "$CORE_MIGRATIONS" "$AUTH_MIGRATIONS" "$TIME_TRAVEL" "$PRODUCT_TIME_TRAVEL"; do
            if [ "$result" != 'success' ]; then
              echo 'ERROR: Otya production operations readiness is not green. Review the failed diagnostic above.'
              exit 1
            fi
          done
          echo 'Otya production operations readiness is green.'
