name: OTYA Telegram Account-Linking Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otya-telegram-account-linking-smoke-production
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify public retired Telegram sign-in remains blocked
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl -sS --max-time 20 -o "$response" -w '%{http_code}' -X POST -H 'Accept: application/json' 'https://petersmartlink.com/api/auth/telegram/start?mode=login')"
          cat "$response"
          echo
          echo "HTTP $status"

          # CI is intentionally not given a Turnstile bypass. Production must
          # reject this automated request to the retired Telegram sign-in route and require the real
          # human challenge before any further provider operation can be attempted.
          test "$status" = "400"
          grep -q 'TURNSTILE_REQUIRED' "$response"

      - name: Check Telegram account-linking page
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' 'https://petersmartlink.com/telegram-login/?telegram_smoke=1')"
          test "$status" = "200"

      - name: Check live Otya bot webhook and Next readiness
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          for attempt in $(seq 1 30); do
            status="$(curl -sS --max-time 20 -o "$response" -w '%{http_code}' 'https://petersmartlink.com/api/telegram/status' || true)"
            if [ "$status" = "200" ] \
              && grep -q '"webhook_configured":true' "$response" \
              && grep -q '"ai_service_bound":true' "$response" \
              && grep -q '"ai_service_ready":true' "$response"; then
              cat "$response"
              echo
              echo 'OTYA Telegram bot runtime and Next dependency are healthy.'
              exit 0
            fi
            echo "Telegram runtime not healthy yet (attempt $attempt, HTTP ${status:-network-error})."
            sleep 10
          done
          cat "$response" || true
          echo '::error::OTYA Telegram bot webhook or live Next dependency is not healthy.'
          exit 1
