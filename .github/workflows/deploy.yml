name: Deploy OTYA to Cloudflare
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/**']
  workflow_dispatch:
    inputs:
      component:
        description: 'Production action after validation'
        required: true
        default: 'validate-only'
        type: choice
        options:
          - validate-only
          - auth
          - next
          - core
          - all
      confirm:
        description: 'Type DEPLOY to authorize a production deployment'
        required: false
        default: ''
        type: string
concurrency:
  group: cloudflare-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  validate:
    name: Validate complete OTYA backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      otyapoint_sha: ${{ steps.otyapoint_source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', package-manager-cache: false }
      - name: Validate OTYA core/web
        run: |
          npm ci --ignore-scripts
          npm run validate:config
          npm test
          npm run build
          npm run typecheck
      - name: Validate auth worker
        working-directory: auth-worker
        run: |
          npm ci --ignore-scripts
          npm test
          npx tsc --noEmit
      - name: Fetch exact OtyaPoint main commit for release validation
        id: otyapoint_source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/PeterSmartLink/OtyaPoint.git "$RUNNER_TEMP/OtyaPoint"
          OTYAPOINT_SHA="$(git -C "$RUNNER_TEMP/OtyaPoint" rev-parse HEAD)"
          echo "sha=$OTYAPOINT_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate OtyaPoint backend, security boundaries and dashboard build
        working-directory: ${{ runner.temp }}/OtyaPoint
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          npm run check:worker
          npm run test:sale-fingerprint
          npm run test:sale-route-idempotency
          npm run test:auth-boundary
          npm run test:agency-list
          npm run test:legacy-products-bridge
          npm run dev:local:check
          npm run test:local-auth
          npm run test:local-runtime
          node --test scripts/export-d1-backup.test.mjs
          npm run lint
          npm run build
          npx --yes wrangler@4.158.0 deploy --dry-run --config wrangler.toml

      - name: Validate Next worker
        working-directory: ai-worker
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check

  authorize-deploy:
    name: Authorize explicit production deploy
    if: (github.event_name == 'workflow_dispatch' && inputs.component != 'validate-only') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[DEPLOY-ALL]'))
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify production authority
        shell: bash
        env:
          COMPONENT: ${{ github.event_name == 'workflow_dispatch' && inputs.component || (contains(github.event.head_commit.message, '[DEPLOY-ALL]') && 'all' || 'validate-only') }}
          CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm || (contains(github.event.head_commit.message, '[DEPLOY-ALL]') && 'DEPLOY' || '') }}
          TARGET_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$TARGET_REF" = 'refs/heads/main' || {
            echo "ERROR: production deploys may only run from the main branch; got $TARGET_REF"
            exit 1
          }
          test "$CONFIRM" = 'DEPLOY' || {
            echo "ERROR: production deployment requires the exact confirmation DEPLOY"
            exit 1
          }
          case "$COMPONENT" in
            auth|next|core|all) ;;
            *) echo "ERROR: unsupported production component $COMPONENT"; exit 1 ;;
          esac
          echo "Production deploy authorized for component: $COMPONENT"

  plan-deploy:
    name: Plan explicitly authorized Otya runtime deploy
    if: (github.event_name == 'workflow_dispatch' && inputs.component != 'validate-only') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[DEPLOY-ALL]'))
    needs: [validate, authorize-deploy]
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.plan.outputs.auth }}
      next: ${{ steps.plan.outputs.next }}
      core: ${{ steps.plan.outputs.core }}
      any_runtime: ${{ steps.plan.outputs.any_runtime }}
    steps:
      - name: Select requested runtime components
        id: plan
        shell: bash
        env:
          COMPONENT: ${{ github.event_name == 'workflow_dispatch' && inputs.component || (contains(github.event.head_commit.message, '[DEPLOY-ALL]') && 'all' || 'validate-only') }}
        run: |
          set -euo pipefail
          auth=false
          next=false
          core=false
          case "$COMPONENT" in
            auth) auth=true ;;
            next) next=true ;;
            core) core=true ;;
            all)
              auth=true
              next=true
              core=true
              ;;
            *)
              echo "ERROR: unsupported production component $COMPONENT"
              exit 1
              ;;
          esac
          echo "auth=$auth" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "any_runtime=true" >> "$GITHUB_OUTPUT"
          echo "Deploy plan: auth=$auth next=$next core=$core"

  deploy-auth:
    name: Deploy otya-auth
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.authorize-deploy.result == 'success' && needs.plan-deploy.result == 'success' && needs.plan-deploy.outputs.auth == 'true' }}
    needs: [validate, authorize-deploy, plan-deploy]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', package-manager-cache: false }
      - working-directory: auth-worker
        run: npm ci --ignore-scripts
      - name: Repair and verify preserved auth D1
        working-directory: auth-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          bash scripts/repair-remote-schema.sh
      - name: Configure and deploy auth
        working-directory: auth-worker
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          TELEGRAM_LOGIN_CLIENT_ID: ${{ secrets.TELEGRAM_LOGIN_CLIENT_ID }}
          TELEGRAM_LOGIN_CLIENT_SECRET: ${{ secrets.TELEGRAM_LOGIN_CLIENT_SECRET }}
          TELEGRAM_GATEWAY_TOKEN: ${{ secrets.TELEGRAM_GATEWAY_TOKEN }}
          ACCOUNT_ENCRYPTION_KEY: ${{ secrets.ACCOUNT_ENCRYPTION_KEY }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          OTYA_NEXT_MAIL_SERVICE_TOKEN: ${{ secrets.OTYA_NEXT_MAIL_SERVICE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AUTH_JWT_SECRET" && test -n "$RESEND_API_KEY" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          grep -q 'secret_name = "OTYAPOINT_INVITE_SERVICE_TOKEN"' wrangler.toml
          printf '%s' "$AUTH_JWT_SECRET" | npx wrangler secret put AUTH_JWT_SECRET
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          if [ -n "${FIREBASE_API_KEY:-}" ]; then printf '%s' "$FIREBASE_API_KEY" | npx wrangler secret put FIREBASE_API_KEY; fi
          if [ -n "${TELEGRAM_LOGIN_CLIENT_ID:-}" ]; then printf '%s' "$TELEGRAM_LOGIN_CLIENT_ID" | npx wrangler secret put TELEGRAM_LOGIN_CLIENT_ID; fi
          if [ -n "${TELEGRAM_LOGIN_CLIENT_SECRET:-}" ]; then printf '%s' "$TELEGRAM_LOGIN_CLIENT_SECRET" | npx wrangler secret put TELEGRAM_LOGIN_CLIENT_SECRET; fi
          if [ -n "${TELEGRAM_GATEWAY_TOKEN:-}" ]; then printf '%s' "$TELEGRAM_GATEWAY_TOKEN" | npx wrangler secret put TELEGRAM_GATEWAY_TOKEN; fi
          if [ -n "${ACCOUNT_ENCRYPTION_KEY:-}" ]; then printf '%s' "$ACCOUNT_ENCRYPTION_KEY" | npx wrangler secret put ACCOUNT_ENCRYPTION_KEY; fi
          if [ -n "${INTERNAL_SECRET:-}" ]; then printf '%s' "$INTERNAL_SECRET" | npx wrangler secret put INTERNAL_SECRET; fi
          if [ -n "${OTYA_NEXT_MAIL_SERVICE_TOKEN:-}" ]; then printf '%s' "$OTYA_NEXT_MAIL_SERVICE_TOKEN" | npx wrangler secret put OTYA_NEXT_MAIL_SERVICE_TOKEN; fi
          npx wrangler deploy

  deploy-next:
    name: Deploy otya-next
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.authorize-deploy.result == 'success' && needs.plan-deploy.result == 'success' && (needs.deploy-auth.result == 'success' || needs.deploy-auth.result == 'skipped') && needs.plan-deploy.outputs.next == 'true' }}
    needs: [validate, authorize-deploy, plan-deploy, deploy-auth]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', package-manager-cache: false }
      - working-directory: ai-worker
        run: npm ci --ignore-scripts
      - name: Configure and deploy Next
        working-directory: ai-worker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OTYA_NEXT_MAIL_SERVICE_TOKEN: ${{ secrets.OTYA_NEXT_MAIL_SERVICE_TOKEN }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          GMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.GMAIL_GOOGLE_CLIENT_SECRET }}
          CONNECTOR_ENCRYPTION_KEY: ${{ secrets.CONNECTOR_ENCRYPTION_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          if [ -n "${RESEND_API_KEY:-}" ]; then printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY; fi
          if [ -n "${OTYA_NEXT_MAIL_SERVICE_TOKEN:-}" ]; then printf '%s' "$OTYA_NEXT_MAIL_SERVICE_TOKEN" | npx wrangler secret put OTYA_NEXT_MAIL_SERVICE_TOKEN; fi
          if [ -n "${INTERNAL_SECRET:-}" ]; then printf '%s' "$INTERNAL_SECRET" | npx wrangler secret put INTERNAL_SECRET; fi
          if [ -n "${GMAIL_GOOGLE_CLIENT_SECRET:-}" ]; then printf '%s' "$GMAIL_GOOGLE_CLIENT_SECRET" | npx wrangler secret put GMAIL_GOOGLE_CLIENT_SECRET; fi
          if [ -n "${CONNECTOR_ENCRYPTION_KEY:-}" ]; then printf '%s' "$CONNECTOR_ENCRYPTION_KEY" | npx wrangler secret put CONNECTOR_ENCRYPTION_KEY; fi
          # Core is the sole Telegram transport owner. Remove any legacy copies
          # left on Next by older deployments while preserving every other secret.
          printf '%s\n' '{"TELEGRAM_BOT_TOKEN":null,"TELEGRAM_WEBHOOK_SECRET":null}' | npx wrangler secret bulk
          npx wrangler deploy

  deploy-core:
    name: Deploy otya-core
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.authorize-deploy.result == 'success' && needs.plan-deploy.result == 'success' && (needs.deploy-auth.result == 'success' || needs.deploy-auth.result == 'skipped') && (needs.deploy-next.result == 'success' || needs.deploy-next.result == 'skipped') && needs.plan-deploy.outputs.core == 'true' }}
    needs: [validate, authorize-deploy, plan-deploy, deploy-auth, deploy-next]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', package-manager-cache: false }
      - run: npm ci --ignore-scripts
      - name: Build and deploy OTYA core
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          FIREBASE_APP_DISTRIBUTION_TESTERS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_TESTERS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RELEASE_MANIFEST_HMAC_SECRET: ${{ secrets.RELEASE_MANIFEST_HMAC_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN" && test -n "$RESEND_API_KEY"
          npm run validate:config
          if [ -n "${FCM_SERVICE_ACCOUNT_JSON:-}" ]; then printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | npx wrangler secret put FCM_SERVICE_ACCOUNT_JSON; fi
          if [ -n "${INTERNAL_SECRET:-}" ]; then printf '%s' "$INTERNAL_SECRET" | npx wrangler secret put INTERNAL_SECRET; fi
          if [ -n "${ADMIN_EMAIL:-}" ]; then printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL; fi
          if [ -n "${ADMIN_PASSWORD:-}" ]; then printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD; fi
          if [ -n "${ADMIN_SESSION_SECRET:-}" ]; then printf '%s' "$ADMIN_SESSION_SECRET" | npx wrangler secret put ADMIN_SESSION_SECRET; fi
          if [ -n "${FIREBASE_APP_DISTRIBUTION_TESTERS:-}" ]; then printf '%s' "$FIREBASE_APP_DISTRIBUTION_TESTERS" | npx wrangler secret put FIREBASE_APP_DISTRIBUTION_TESTERS; fi
          if [ -n "${RESEND_API_KEY:-}" ]; then printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY; fi
          test -n "$RELEASE_MANIFEST_HMAC_SECRET"
          printf '%s' "$RELEASE_MANIFEST_HMAC_SECRET" | npx wrangler secret put RELEASE_MANIFEST_HMAC_SECRET
          if [ -n "${TURNSTILE_SECRET_KEY:-}" ]; then printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY; fi
          npm run deploy
          node scripts/sync-production-kv.mjs

  deploy-otyapoint:
    name: Deploy private OtyaPoint API
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.authorize-deploy.result == 'success' && needs.plan-deploy.result == 'success' && needs.plan-deploy.outputs.core == 'true' && (needs.deploy-auth.result == 'success' || needs.deploy-auth.result == 'skipped') && (needs.deploy-next.result == 'success' || needs.deploy-next.result == 'skipped') && (needs.deploy-core.result == 'success' || needs.deploy-core.result == 'skipped') }}
    needs: [validate, authorize-deploy, plan-deploy, deploy-auth, deploy-next, deploy-core]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out the ecosystem release controller
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with: { node-version: '22', package-manager-cache: false }

      - name: Fetch the exact OtyaPoint commit that passed validation
        shell: bash
        env:
          OTYAPOINT_SHA: ${{ needs.validate.outputs.otyapoint_sha }}
        run: |
          set -euo pipefail
          test -n "$OTYAPOINT_SHA"
          git init "$RUNNER_TEMP/OtyaPoint"
          git -C "$RUNNER_TEMP/OtyaPoint" remote add origin https://github.com/PeterSmartLink/OtyaPoint.git
          git -C "$RUNNER_TEMP/OtyaPoint" fetch --depth 1 origin "$OTYAPOINT_SHA"
          git -C "$RUNNER_TEMP/OtyaPoint" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/OtyaPoint" rev-parse HEAD)" = "$OTYAPOINT_SHA"
          test -f "$RUNNER_TEMP/OtyaPoint/wrangler.toml"

      - name: Install OtyaPoint dependencies
        working-directory: ${{ runner.temp }}/OtyaPoint
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Test and validate OtyaPoint release
        working-directory: ${{ runner.temp }}/OtyaPoint
        run: |
          set -euo pipefail
          npm run check:worker
          npm run test:sale-fingerprint
          npm run test:sale-route-idempotency
          npm run test:auth-boundary
          npm run test:agency-list
          npm run test:legacy-products-bridge
          npm run dev:local:check
          npm run test:local-auth
          npm run test:local-runtime
          node --test scripts/export-d1-backup.test.mjs
          npm run lint
          npm run build
          npx --yes wrangler@4.158.0 deploy --dry-run --config wrangler.toml

      - name: Require existing production Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "Cloudflare deployment credentials are present; application secrets are read from the account Secrets Store."

      - name: Deploy the private OtyaPoint API
        working-directory: ${{ runner.temp }}/OtyaPoint
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.158.0 deploy --config wrangler.toml

      - name: Verify OtyaPoint is deployed privately at 100 percent
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/otyapoint-api/deployments?per_page=1")"
          printf '%s' "$response" | jq -e '
            .success == true and
            (.result.deployments | length) > 0 and
            .result.deployments[0].versions[0].percentage == 100
          ' >/dev/null
          echo "OtyaPoint API deployment is present and receives 100% of its Worker traffic."
          echo "The Worker remains private: workers.dev is disabled and no public custom route is attached."

  verify-production:
    name: Verify live OTYA after deploy
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.authorize-deploy.result == 'success' && needs.plan-deploy.result == 'success' && needs.plan-deploy.outputs.any_runtime == 'true' && (needs.deploy-auth.result == 'success' || needs.deploy-auth.result == 'skipped') && (needs.deploy-next.result == 'success' || needs.deploy-next.result == 'skipped') && (needs.deploy-core.result == 'success' || needs.deploy-core.result == 'skipped') && (needs.deploy-otyapoint.result == 'success' || needs.deploy-otyapoint.result == 'skipped') }}
    needs: [validate, authorize-deploy, plan-deploy, deploy-auth, deploy-next, deploy-core, deploy-otyapoint]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait for Cloudflare propagation
        run: sleep 15
      - name: Smoke-test OTYA public surfaces
        run: |
          set -euo pipefail
          check() {
            local url="$1"
            local expected="$2"
            local code=""
            for attempt in 1 2 3 4 5; do
              code="$(curl --silent --show-error --location --output /tmp/otya-smoke-body --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "$url" || true)"
              if printf '%s' "$code" | grep -Eq "$expected"; then
                echo "OK $url -> $code"
                return 0
              fi
              echo "Attempt $attempt: $url -> ${code:-network-error}"
              sleep $((attempt * 5))
            done
            echo "::error::Production smoke test failed for $url (last status ${code:-network-error})"
            head -c 1000 /tmp/otya-smoke-body 2>/dev/null || true
            exit 1
          }
          check https://petersmartlink.com/ '^(200|301|302|307|308)$'
          check https://petersmartlink.com/latest '^(200|301|302|307|308)$'
          check https://petersmartlink.com/download '^(200|301|302|307|308)$'
          check https://petersmartlink.com/download/otya '^(200|301|302|307|308)$'
          check https://petersmartlink.com/download/otya-player '^(200|301|302|307|308)$'
          check https://petersmartlink.com/api/version '^(200|401)$'
          check https://petersmartlink.com/api/security/turnstile/config '^200$'
          check https://docs.petersmartlink.com/ '^(200|301|302|307|308)$'
          check https://status.petersmartlink.com/ '^(200|301|302|307|308)$'
          check https://space.petersmartlink.com/ '^(200|301|302|307|308)$'
      - name: Verify core trust surfaces
        if: ${{ needs.plan-deploy.outputs.core == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 \
            https://petersmartlink.com/.well-known/security.txt \
            --output /tmp/otya-security.txt
          grep -Fxq 'Contact: mailto:support@petersmartlink.com' /tmp/otya-security.txt
          grep -Fxq 'Canonical: https://petersmartlink.com/.well-known/security.txt' /tmp/otya-security.txt

          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 \
            https://status.petersmartlink.com/api/status \
            --output /tmp/otya-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/otya-status.json').read_text())
          if data.get('status') not in {'operational', 'degraded'}:
              raise SystemExit('public status has invalid overall state')
          components = data.get('components') or {}
          if set(components) != {'website', 'accounts', 'next'}:
              raise SystemExit('public status component set changed unexpectedly')
          if any(value not in {'operational', 'degraded'} for value in components.values()):
              raise SystemExit('public status has invalid component state')
          if not str(data.get('checkedAt') or '').strip():
              raise SystemExit('public status has no checkedAt timestamp')
          print('Core public trust surfaces are healthy and privacy-bounded')
          PY

          turnstile_status="$(curl --silent --show-error --location --output /tmp/otya-turnstile-config.json --write-out '%{http_code}' --connect-timeout 10 --max-time 20 https://petersmartlink.com/api/security/turnstile/config || true)"
          test "$turnstile_status" = "200" || {
            echo "::error::Turnstile config endpoint returned ${turnstile_status:-network-error}"
            head -c 1000 /tmp/otya-turnstile-config.json 2>/dev/null || true
            exit 1
          }
          grep -Eq '"turnstile"[[:space:]]*:[[:space:]]*true' /tmp/otya-turnstile-config.json || {
            echo "::error::Turnstile is not enabled after production deploy"
            head -c 1000 /tmp/otya-turnstile-config.json 2>/dev/null || true
            exit 1
          }
          grep -Eq '"siteKey"[[:space:]]*:[[:space:]]*"[^"]+"' /tmp/otya-turnstile-config.json || {
            echo "::error::Turnstile site key is unavailable after production deploy"
            head -c 1000 /tmp/otya-turnstile-config.json 2>/dev/null || true
            exit 1
          }
          # Resend callbacks must reach the signed handler; GET is deliberately rejected.
          check https://petersmartlink.com/webhooks/ '^405$'
          check https://docs.petersmartlink.com/ '^(200|301|302|307|308)$'
          check https://status.petersmartlink.com/ '^(200|301|302|307|308)$'
          check https://space.petersmartlink.com/ '^(200|301|302|307|308)$'
