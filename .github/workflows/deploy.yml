    name: Deploy Omy Play
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.authorize-deploy.result == 'success' && needs.plan-deploy.result == 'success' && needs.plan-deploy.outputs.omy_play == 'true' && (needs.deploy-oid.result == 'success' || needs.deploy-oid.result == 'skipped') && (needs.deploy-oend.result == 'success' || needs.deploy-oend.result == 'skipped') }}
    needs: [validate, authorize-deploy, plan-deploy, deploy-oid, deploy-oend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out Omy Play
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OtyaHQ/Omy_Play
          ref: ${{ needs.validate.outputs.omy_play_sha }}
          path: Omy_Play
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4', package-manager-cache: false }

      - name: Deploy Omy Play production API
        working-directory: Omy_Play
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.159.0 deploy --dry-run --config wrangler.omy-play-production.toml
          npx --yes wrangler@4.159.0 deploy --config wrangler.omy-play-production.toml

      - name: Verify Omy Play private production Worker and OID binding
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/omy-play"
          settings="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/settings")"
          secrets="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/secrets")"
