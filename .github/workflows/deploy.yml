name: Deploy Otya ecosystem to Cloudflare
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      component:
        description: 'Choose the canonical production component'
        required: true
        default: 'validate-only'
        type: choice
        options:
          - validate-only
          - oid
          - o
          - oend
          - opoint
          - omy-play
          - all
      confirm:
        description: 'Type DEPLOY to authorize the selected production release'
        required: false
        default: ''
        type: string
concurrency:
  group: cloudflare-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  validate:
    name: Validate OID OEnd O Opoint and Omy Play
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      opoint_sha: ${{ steps.opoint_source.outputs.sha }}
      omy_play_sha: ${{ steps.omy_play_source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4', package-manager-cache: false }
      - name: Validate OEnd web
        run: |
          npm ci --ignore-scripts
          npm run validate:config
          npm test
          npm run build
          npm run typecheck
      - name: Validate auth worker
        working-directory: auth-worker
        run: |
          npm ci --ignore-scripts
          npm test
          npx tsc --noEmit
      - name: Fetch exact Opoint main commit for release validation
        id: opoint_source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/OtyaHQ/OPoint.git "$RUNNER_TEMP/OPoint"
          OPOINT_SHA="$(git -C "$RUNNER_TEMP/OPoint" rev-parse HEAD)"
          echo "sha=$OPOINT_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate Opoint backend, security boundaries and dashboard build
        working-directory: ${{ runner.temp }}/OPoint
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          npm run check:worker
          npm run test:sale-fingerprint
          npm run test:sale-route-idempotency
          npm run test:auth-boundary
          npm run test:agency-list
          npm run test:legacy-products-bridge
          npm run test:quickteller
          npm run dev:local:check
          npm run test:local-auth
          npm run test:local-runtime
          node --test scripts/export-d1-backup.test.mjs
          npm run lint
          npm run build
          npx --yes wrangler@4.159.0 deploy --dry-run --config wrangler.toml

      - name: Fetch exact Omy Play main commit for release validation
        id: omy_play_source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/OtyaHQ/Omy_Play.git "$RUNNER_TEMP/Omy_Play"
          echo "sha=$(git -C "$RUNNER_TEMP/Omy_Play" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify Omy Play backend source and schema contract
        working-directory: ${{ runner.temp }}/Omy_Play
        run: |
          set -euo pipefail
          npm install --prefix backend --no-audit --no-fund --ignore-scripts
          npm --prefix backend run check
          npm --prefix backend test
          npm --prefix backend run verify:schema
      - name: Validate O worker
        working-directory: ai-worker
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check

  authorize-deploy:
    name: Authorize explicit production deploy
    if: (github.event_name == 'workflow_dispatch' && inputs.component != 'validate-only') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[DEPLOY-ALL]'))
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify production authority
        shell: bash
        env:
          COMPONENT: ${{ github.event_name == 'workflow_dispatch' && inputs.component || (contains(github.event.head_commit.message, '[DEPLOY-ALL]') && 'all' || 'validate-only') }}
          CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm || (contains(github.event.head_commit.message, '[DEPLOY-ALL]') && 'DEPLOY' || '') }}
          TARGET_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$TARGET_REF" = 'refs/heads/main' || {
            echo "ERROR: production deploys may only run from the main branch; got $TARGET_REF"
            exit 1
          }
          test "$CONFIRM" = 'DEPLOY' || {
            echo "ERROR: production deployment requires the exact confirmation DEPLOY"
            exit 1
          }
          case "$COMPONENT" in
            oid|o|oend|opoint|omy-play|all) ;;
            *) echo "ERROR: unsupported production component $COMPONENT"; exit 1 ;;
          esac
          echo "Production deploy authorized for component: $COMPONENT"

  plan-deploy:
    name: Plan explicitly authorized Otya runtime deploy
    if: (github.event_name == 'workflow_dispatch' && inputs.component != 'validate-only') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[DEPLOY-ALL]'))
    needs: [validate, authorize-deploy]
    runs-on: ubuntu-latest
    outputs:
      oid: ${{ steps.plan.outputs.oid }}
      o: ${{ steps.plan.outputs.o }}
      oend: ${{ steps.plan.outputs.oend }}
      opoint: ${{ steps.plan.outputs.opoint }}
      omy_play: ${{ steps.plan.outputs.omy_play }}
      any_runtime: ${{ steps.plan.outputs.any_runtime }}
    steps:
      - name: Select requested runtime components
        id: plan
        shell: bash
        env:
          COMPONENT: ${{ github.event_name == 'workflow_dispatch' && inputs.component || (contains(github.event.head_commit.message, '[DEPLOY-ALL]') && 'all' || 'validate-only') }}
        run: |
          set -euo pipefail
          oid=false
          o=false
          oend=false
          opoint=false
          omy_play=false
          case "$COMPONENT" in
            oid) oid=true ;;
            o) oid=true; o=true; oend=true ;;
            oend) oid=true; o=true; oend=true ;;
            opoint) oid=true; o=true; oend=true; opoint=true ;;
            omy-play) oid=true; o=true; oend=true; omy_play=true ;;
            all)
              oid=true
              o=true
              oend=true
              opoint=true
              omy_play=true
              ;;
            *)
              echo "ERROR: unsupported production component $COMPONENT"
              exit 1
              ;;
          esac
          echo "oid=$oid" >> "$GITHUB_OUTPUT"
          echo "o=$o" >> "$GITHUB_OUTPUT"
          echo "oend=$oend" >> "$GITHUB_OUTPUT"
          echo "opoint=$opoint" >> "$GITHUB_OUTPUT"
          echo "omy_play=$omy_play" >> "$GITHUB_OUTPUT"
          echo "any_runtime=true" >> "$GITHUB_OUTPUT"
          echo "Deploy plan: OID=$oid O=$o OEnd=$oend Opoint=$opoint OmyPlay=$omy_play"

  deploy-oid:
    name: Deploy OID
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.authorize-deploy.result == 'success' && needs.plan-deploy.result == 'success' && needs.plan-deploy.outputs.oid == 'true' }}
    needs: [validate, authorize-deploy, plan-deploy]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4', package-manager-cache: false }
      - working-directory: auth-worker
        run: npm ci --ignore-scripts
      - name: Repair and verify preserved auth D1
        working-directory: auth-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OTYA_AUTH_DB_NAME: otya-id-db
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          bash scripts/repair-remote-schema.sh
      - name: Configure and deploy OID
        working-directory: auth-worker
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          TELEGRAM_LOGIN_CLIENT_ID: ${{ secrets.TELEGRAM_LOGIN_CLIENT_ID }}
          TELEGRAM_LOGIN_CLIENT_SECRET: ${{ secrets.TELEGRAM_LOGIN_CLIENT_SECRET }}
          TELEGRAM_GATEWAY_TOKEN: ${{ secrets.TELEGRAM_GATEWAY_TOKEN }}
          ACCOUNT_ENCRYPTION_KEY: ${{ secrets.ACCOUNT_ENCRYPTION_KEY }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          OTYA_O_MAIL_SERVICE_TOKEN: ${{ secrets.OTYA_O_MAIL_SERVICE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AUTH_JWT_SECRET" && test -n "$RESEND_API_KEY" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          grep -q 'secret_name = "OPOINT_INVITE_SERVICE_TOKEN"' wrangler.toml
          printf '%s' "$AUTH_JWT_SECRET" | npx wrangler secret put AUTH_JWT_SECRET
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          if [ -n "${FIREBASE_API_KEY:-}" ]; then printf '%s' "$FIREBASE_API_KEY" | npx wrangler secret put FIREBASE_API_KEY; fi
          if [ -n "${TELEGRAM_LOGIN_CLIENT_ID:-}" ]; then printf '%s' "$TELEGRAM_LOGIN_CLIENT_ID" | npx wrangler secret put TELEGRAM_LOGIN_CLIENT_ID; fi
          if [ -n "${TELEGRAM_LOGIN_CLIENT_SECRET:-}" ]; then printf '%s' "$TELEGRAM_LOGIN_CLIENT_SECRET" | npx wrangler secret put TELEGRAM_LOGIN_CLIENT_SECRET; fi
          if [ -n "${TELEGRAM_GATEWAY_TOKEN:-}" ]; then printf '%s' "$TELEGRAM_GATEWAY_TOKEN" | npx wrangler secret put TELEGRAM_GATEWAY_TOKEN; fi
          if [ -n "${ACCOUNT_ENCRYPTION_KEY:-}" ]; then printf '%s' "$ACCOUNT_ENCRYPTION_KEY" | npx wrangler secret put ACCOUNT_ENCRYPTION_KEY; fi
          if [ -n "${INTERNAL_SECRET:-}" ]; then printf '%s' "$INTERNAL_SECRET" | npx wrangler secret put INTERNAL_SECRET; fi
          if [ -n "${OTYA_O_MAIL_SERVICE_TOKEN:-}" ]; then printf '%s' "$OTYA_O_MAIL_SERVICE_TOKEN" | npx wrangler secret put OTYA_O_MAIL_SERVICE_TOKEN; fi
          npx wrangler deploy
          settings="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/oid/settings")"
          printf '%s' "$settings" | jq -e '.success == true and any(.result.bindings[]; .name == "AUTH_DB" and .type == "d1" and .database_id == "0501d1c1-7f7f-4760-9486-b594bae6436f")' >/dev/null
          echo "OID is bound to the canonical otya-id-db identity store."

  deploy-o:
    name: Deploy O
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.authorize-deploy.result == 'success' && needs.plan-deploy.result == 'success' && (needs.deploy-oid.result == 'success' || needs.deploy-oid.result == 'skipped') && needs.plan-deploy.outputs.o == 'true' }}
    needs: [validate, authorize-deploy, plan-deploy, deploy-oid]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4', package-manager-cache: false }
      - working-directory: ai-worker
        run: npm ci --ignore-scripts
      - name: Configure and deploy O
        working-directory: ai-worker
        env:
          OTYA_O_MAIL_SERVICE_TOKEN: ${{ secrets.OTYA_O_MAIL_SERVICE_TOKEN }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          GMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.GMAIL_GOOGLE_CLIENT_SECRET }}
          CONNECTOR_ENCRYPTION_KEY: ${{ secrets.CONNECTOR_ENCRYPTION_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          if [ -n "${OTYA_O_MAIL_SERVICE_TOKEN:-}" ]; then printf '%s' "$OTYA_O_MAIL_SERVICE_TOKEN" | npx wrangler secret put OTYA_O_MAIL_SERVICE_TOKEN; fi
          if [ -n "${INTERNAL_SECRET:-}" ]; then printf '%s' "$INTERNAL_SECRET" | npx wrangler secret put INTERNAL_SECRET; fi
          if [ -n "${GMAIL_GOOGLE_CLIENT_SECRET:-}" ]; then printf '%s' "$GMAIL_GOOGLE_CLIENT_SECRET" | npx wrangler secret put GMAIL_GOOGLE_CLIENT_SECRET; fi
          if [ -n "${CONNECTOR_ENCRYPTION_KEY:-}" ]; then printf '%s' "$CONNECTOR_ENCRYPTION_KEY" | npx wrangler secret put CONNECTOR_ENCRYPTION_KEY; fi
          # Core is the sole Telegram transport owner. Remove any legacy copies
          # left on O by older deployments while preserving every other secret.
          printf '%s\n' '{"TELEGRAM_BOT_TOKEN":null,"TELEGRAM_WEBHOOK_SECRET":null}' | npx wrangler secret bulk
          sed 's/service = "oend"/service = "otya-core"/' wrangler.toml > wrangler.bootstrap.toml
          grep -q 'service = "otya-core"' wrangler.bootstrap.toml
          npx wrangler deploy --config wrangler.bootstrap.toml

  deploy-oend:
    name: Deploy OEnd
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.authorize-deploy.result == 'success' && needs.plan-deploy.result == 'success' && (needs.deploy-oid.result == 'success' || needs.deploy-oid.result == 'skipped') && (needs.deploy-o.result == 'success' || needs.deploy-o.result == 'skipped') && needs.plan-deploy.outputs.oend == 'true' }}
    needs: [validate, authorize-deploy, plan-deploy, deploy-oid, deploy-o]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4', package-manager-cache: false }
      - run: npm ci --ignore-scripts
      - name: Build and deploy OEnd
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          FIREBASE_APP_DISTRIBUTION_TESTERS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_TESTERS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RELEASE_MANIFEST_HMAC_SECRET: ${{ secrets.RELEASE_MANIFEST_HMAC_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN" && test -n "$RESEND_API_KEY"
          npm run validate:config
          if [ -n "${FCM_SERVICE_ACCOUNT_JSON:-}" ]; then printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | npx wrangler secret put FCM_SERVICE_ACCOUNT_JSON; fi
          if [ -n "${INTERNAL_SECRET:-}" ]; then printf '%s' "$INTERNAL_SECRET" | npx wrangler secret put INTERNAL_SECRET; fi
          if [ -n "${ADMIN_EMAIL:-}" ]; then printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL; fi
          if [ -n "${ADMIN_PASSWORD:-}" ]; then printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD; fi
          if [ -n "${ADMIN_SESSION_SECRET:-}" ]; then printf '%s' "$ADMIN_SESSION_SECRET" | npx wrangler secret put ADMIN_SESSION_SECRET; fi
          if [ -n "${FIREBASE_APP_DISTRIBUTION_TESTERS:-}" ]; then printf '%s' "$FIREBASE_APP_DISTRIBUTION_TESTERS" | npx wrangler secret put FIREBASE_APP_DISTRIBUTION_TESTERS; fi
          if [ -n "${RESEND_API_KEY:-}" ]; then printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY; fi
          test -n "$RELEASE_MANIFEST_HMAC_SECRET"
          printf '%s' "$RELEASE_MANIFEST_HMAC_SECRET" | npx wrangler secret put RELEASE_MANIFEST_HMAC_SECRET
          if [ -n "${TURNSTILE_SECRET_KEY:-}" ]; then printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY; fi
          npm run deploy
          node scripts/sync-production-kv.mjs
      - name: Verify OEnd owns canonical public hosts and product bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          settings="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/scripts/oend/settings")"
          assert_service() {
            local binding="$1"
            local service="$2"
            printf '%s' "$settings" | jq -e --arg binding "$binding" --arg service "$service"               'any(.result.bindings[]; .name == $binding and .type == "service" and .service == $service)' >/dev/null
          }
          assert_service AUTH oid
          assert_service AI_SUPPORT o
          assert_service OPOINT_API opoint
          assert_service OMY_PLAY_API omy-play
          printf '%s' "$settings" | jq -e '.success == true and any(.result.bindings[]; .name == "DB" and .type == "d1" and .database_id == "8639040c-2365-45ea-9e49-8f6228116471")' >/dev/null
          domains="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/domains")"
          for hostname in otya.site www.otya.site docs.otya.site status.otya.site space.otya.site api.otya.site; do
            printf '%s' "$domains" | jq -e --arg hostname "$hostname"               'any(.result[]; .hostname == $hostname and .service == "oend" and .enabled == true)' >/dev/null
          done
          echo "All six canonical hosts route to OEnd; OID, O, Opoint and Omy Play bindings are canonical."

  deploy-o-final:
    name: Finalize O with canonical OEnd binding
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.authorize-deploy.result == 'success' && needs.plan-deploy.result == 'success' && needs.deploy-o.result == 'success' && needs.deploy-oend.result == 'success' && needs.plan-deploy.outputs.o == 'true' }}
    needs: [validate, authorize-deploy, plan-deploy, deploy-o, deploy-oend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4', package-manager-cache: false }
      - name: Deploy canonical O configuration
        working-directory: ai-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          ! grep -q 'service = "otya-core"' wrangler.toml
          grep -q 'service = "oend"' wrangler.toml
          npx wrangler deploy --config wrangler.toml
          settings="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/o/settings")"
          printf '%s' "$settings" | jq -e '.success == true and any(.result.bindings[]; .name == "CORE" and .type == "service" and .service == "oend") and any(.result.bindings[]; .name == "AUTH" and .type == "service" and .service == "oid")' >/dev/null
          echo "O now calls OEnd and OID through canonical service bindings."

  deploy-opoint:
    name: Deploy Opoint
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.authorize-deploy.result == 'success' && needs.plan-deploy.result == 'success' && needs.plan-deploy.outputs.opoint == 'true' && (needs.deploy-oid.result == 'success' || needs.deploy-oid.result == 'skipped') && (needs.deploy-oend.result == 'success' || needs.deploy-oend.result == 'skipped') }}
    needs: [validate, authorize-deploy, plan-deploy, deploy-oid, deploy-oend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out the ecosystem release controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.23.4', package-manager-cache: false }

      - name: Fetch the exact Opoint commit that passed validation
        shell: bash
        env:
          OPOINT_SHA: ${{ needs.validate.outputs.opoint_sha }}
        run: |
          set -euo pipefail
          test -n "$OPOINT_SHA"
          git init "$RUNNER_TEMP/OPoint"
          git -C "$RUNNER_TEMP/OPoint" remote add origin https://github.com/OtyaHQ/OPoint.git
          git -C "$RUNNER_TEMP/OPoint" fetch --depth 1 origin "$OPOINT_SHA"
          git -C "$RUNNER_TEMP/OPoint" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/OPoint" rev-parse HEAD)" = "$OPOINT_SHA"
          test -f "$RUNNER_TEMP/OPoint/wrangler.toml"

      - name: Install Opoint dependencies
        working-directory: ${{ runner.temp }}/OPoint
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Test and validate Opoint release
        working-directory: ${{ runner.temp }}/OPoint
        run: |
          set -euo pipefail
          npm run check:worker
          npm run test:sale-fingerprint
          npm run test:sale-route-idempotency
          npm run test:auth-boundary
          npm run test:agency-list
          npm run test:legacy-products-bridge
          npm run test:quickteller
          npm run dev:local:check
          npm run test:local-auth
          npm run test:local-runtime
          node --test scripts/export-d1-backup.test.mjs
          npm run lint
          npm run build
          npx --yes wrangler@4.159.0 deploy --dry-run --config wrangler.toml

      - name: Require existing production Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "Cloudflare deployment credentials are present; application secrets are read from the account Secrets Store."

      - name: Deploy the private Opoint API
        working-directory: ${{ runner.temp }}/OPoint
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
