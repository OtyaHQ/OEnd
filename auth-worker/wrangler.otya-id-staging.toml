# Private Otya ID staging Worker for OtyaPoint and future product integration.
# This runtime has its own D1, KV and unique secrets; it does not use otya-auth.
name = "otya-id-staging"
main = "src/production-entrypoint-secure.ts"
compatibility_date = "2026-11-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
keep_vars = false

[vars]
ENVIRONMENT = "staging"
CORS_ORIGIN = "https://otya.site"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "otya-id-staging-db"
database_id = "575e42b8-fa87-4161-a0df-e7bba50b3df8"
migrations_dir = "migrations-staging"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "9bcd68a2cc014b68bdebac9ef6183314"

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# The deployment workflow provisions these values only from dedicated staging secrets.
[secrets]
required = ["AUTH_JWT_SECRET", "RESEND_API_KEY"]
