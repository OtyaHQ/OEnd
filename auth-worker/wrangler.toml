name = "otya-auth"
main = "src/production-entrypoint-miniapp.ts"
compatibility_date = "2026-11-09"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
workers_dev = false

[observability]
enabled = true
redact_query_string = true
[observability.logs]
enabled = true
head_sampling_rate = 0.5
[observability.traces]
enabled = true
head_sampling_rate = 0.05

[observability.issues]
enabled = true

[[secrets_store_secrets]]
binding = "TELEGRAM_BOT_TOKEN"
store_id = "a1df6b906c6e4c1da6e7687330ea0f9c"
secret_name = "TELEGRAM_BOT_TOKEN"

[[secrets_store_secrets]]
binding = "OTYAPOINT_INVITE_SERVICE_TOKEN"
store_id = "a1df6b906c6e4c1da6e7687330ea0f9c"
secret_name = "OTYAPOINT_INVITE_SERVICE_TOKEN"

[[d1_databases]]
binding       = "AUTH_DB"
database_name = "otya-auth-db"
database_id   = "b05595f6-260a-4720-acca-4f8b13f5c43e"

[[kv_namespaces]]
binding = "AUTH_KV"
id      = "6b9faff751724fdb86c16452b9c99cf6"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "otya-auth-analytics"

[vars]
OTYA_PUBLIC_URL = "https://otya.site"
OTYA_ALLOWED_ORIGINS = "https://otya.site,https://www.otya.site,https://space.otya.site,https://api.otya.site"
OTYA_NO_REPLY_EMAIL = "noreply@otya.site"
OTYA_SUPPORT_EMAIL = "support@otya.site"
GOOGLE_CLIENT_ID = "82776565585-77b1t8epvmn3mpdvstdg1rtprlju4suv.apps.googleusercontent.com"
GOOGLE_WEB_CLIENT_ID = "82776565585-obr8k53b8n6djsggissv8qne81cm3u5u.apps.googleusercontent.com"
FIREBASE_PROJECT_ID = "otya-player"
TELEGRAM_LOGIN_REDIRECT_URI = "https://otya.site/api/auth/telegram/callback"
TELEGRAM_LOGIN_BOT_USERNAME = "OtyaPlayerBot"
ADMIN_EMAILS = "petersmartlink@gmail.com"

# Telegram is available only as a linked-account OTP and notification channel.
# It cannot establish Otya identity or issue a session. Bot credentials remain
# in Cloudflare Secrets Store and are shared by binding, never copied to GitHub.
