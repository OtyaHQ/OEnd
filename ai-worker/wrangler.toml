name = "o"
main = "src/scheduled-entry.mjs"
compatibility_date = "2026-11-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
tags = ["O", "owner-workspace", "production"]
[observability]
enabled = true
redact_query_string = true
[observability.logs]
enabled = true
head_sampling_rate = 1
[observability.traces]
enabled = true
head_sampling_rate = 0.1
[observability.issues]
enabled = true
[vars]
ENVIRONMENT = "production"
APP_NAME = "O"
WEBSITE_URL = "https://otya.site"
OWNER_ONLY = "true"
PUBLIC_CHAT_ENABLED = "false"
ADMIN_REPORT_EMAIL = "otyahq@gmail.com"
ADMIN_CRASH_ALERT_THRESHOLD = "5"
TELEGRAM_BOT_USERNAME = "OtyaPlayerBot"
TELEGRAM_CHANNEL_URL = "https://t.me/otyaplayer"
AI_GATEWAY_ID = "o-gateway"
AI_PUBLIC_MODELS = "llama-fast,otya-smart,gemma-4,granite,llama-70b,gpt-oss-20b,gpt-oss-120b,nemotron,llama-4-scout,qwen3,sea-lion"
AI_GUEST_MODEL = "llama-fast"
AI_DEFAULT_MODEL = "otya-smart"
OTYA_AI_MODEL = "@cf/zai-org/glm-4.7-flash"
OTYA_REPORT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
GMAIL_GOOGLE_CLIENT_ID = "82776565585-obr8k53b8n6djsggissv8qne81cm3u5u.apps.googleusercontent.com"
[ai]
binding = "AI"
[browser]
binding = "BROWSER"
[[ai_search]]
binding = "AI_SEARCH"
instance_name = "otya-knowledge"
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "o-analytics"
[[d1_databases]]
binding = "DB"
database_name = "o-prod-db"
database_id = "92d2af72-bb6e-401c-8240-61a0a224ee64"
[[kv_namespaces]]
binding = "KV"
id = "b0742c135e2243b9880bd83bf09504ad"
[[queues.consumers]]
queue = "o-jobs"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "o-jobs-dlq"
[[services]]
binding = "AUTH"
service = "oid"
[[services]]
binding = "CORE"
service = "oend"
